name: Deploy to Sandbox

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: write # push git tag
  id-token: write # OIDC for AWS

jobs:
  deploy:
    name: CDK Deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true # required for "Capture last good version tag"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture last good version tag
        id: last-good
        run: |
          TAG=$(git tag --sort=-version:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Last good tag: $TAG"

      - name: Resolve version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: Build MCP bundle
        run: pnpm --filter @bookshelf/mcp run build

      - name: Stub web dist for CDK synth
        # WebStack references apps/web/dist as an S3 asset at synth time.
        # The real build runs after stack outputs are resolved; this stub lets
        # CDK synthesise all stacks without the dist directory existing yet.
        run: mkdir -p apps/web/dist

      - name: Deploy Auth, API, and MCP stacks
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth BookshelfApi BookshelfMcp \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.tag }}

      - name: Resolve stack outputs
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrlOutput'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolIdOutput'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientIdOutput'].OutputValue" \
            --output text)
          echo "api_url=$API_URL"           >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID"       >> "$GITHUB_OUTPUT"

      - name: Build web app
        # No VITE_* env needed: the bundle fetches /config.json at runtime, which
        # WebStack writes to S3 at deploy time from the Auth/API stack properties
        # (ADR-011). The same artifact works in any environment.
        run: pnpm --filter @bookshelf/web run build

      - name: Reconcile orphaned BucketDeployment log group
        # WebStack's CDK BucketDeployment custom-resource Lambda auto-created its
        # CloudWatch log group on first run, before the
        # `@aws-cdk/aws-lambda:useCdkManagedLogGroup` feature flag was enabled. With
        # the flag on, CDK now emits an explicit AWS::Logs::LogGroup with that same
        # name, and CloudFormation's early-validation rejects the change set because
        # the log group already exists. This step deletes the orphaned (untracked)
        # log group once so CDK can create and manage it cleanly; it is a no-op once
        # the managed log group is tracked in the stack.
        run: |
          set -euo pipefail
          STACK_NAME="BookshelfWeb"

          # Distinguish "stack does not exist" (fresh env — the Lambda and its
          # managed log group are created together, so no orphan) from real errors.
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text 2>&1) || {
            if echo "$STATUS" | grep -q "does not exist"; then
              echo "$STACK_NAME stack not found — nothing to reconcile."
              exit 0
            fi
            echo "::error::Failed to describe stack $STACK_NAME: $STATUS"
            exit 1
          }

          # If the stack already tracks the BucketDeployment log group, the
          # migration is complete — nothing to reconcile.
          TRACKED=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Logs::LogGroup' && starts_with(LogicalResourceId, 'CustomCDKBucketDeployment')].PhysicalResourceId" \
            --output text)
          if [ -n "$TRACKED" ] && [ "$TRACKED" != "None" ]; then
            echo "BucketDeployment log group already tracked in CloudFormation ($TRACKED) — nothing to do."
            exit 0
          fi

          # Not tracked yet. Delete any orphaned auto-created log group(s) under the
          # BucketDeployment Lambda's name prefix so CDK can create the managed one.
          PREFIX="/aws/lambda/${STACK_NAME}-CustomCDKBucketDeployment"
          GROUPS=$(aws logs describe-log-groups \
            --log-group-name-prefix "$PREFIX" \
            --query "logGroups[].logGroupName" \
            --output text)
          if [ -z "$GROUPS" ] || [ "$GROUPS" = "None" ]; then
            echo "No orphaned log group under $PREFIX — nothing to do."
            exit 0
          fi
          for G in $GROUPS; do
            echo "Deleting orphaned log group: $G"
            aws logs delete-log-group --log-group-name "$G"
          done
          echo "Orphaned BucketDeployment log group(s) removed."

      - name: Deploy Web stack
        # BucketDeployment inside WebStack syncs dist/ to S3 and invalidates
        # CloudFront — no separate sync or invalidation steps needed.
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.tag }}

      - name: Register CloudFront domain in Auth callbacks
        # Auth deployed before Web (no CloudFront URL yet). Now that WebStack is up,
        # pass the distribution domain as CDK context so Cognito's app client gets
        # the CloudFront callback URL registered. No-op on subsequent deploys if the
        # URL is already registered.
        run: |
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfWeb \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionUrlOutput'].OutputValue" \
            --output text)
          CF_DOMAIN="${CF_URL#https://}"
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.tag }} \
            -c cloudfront-domain="${CF_DOMAIN}"

      - name: Smoke tests
        id: smoke
        continue-on-error: true
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke

      - name: Rollback to last good version
        if: steps.smoke.outcome == 'failure' && steps.last-good.outputs.tag != ''
        run: |
          echo "Smoke tests failed — rolling back to ${{ steps.last-good.outputs.tag }}"
          git checkout ${{ steps.last-good.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm --filter @bookshelf/api run build
          pnpm --filter @bookshelf/mcp run build 2>/dev/null || mkdir -p apps/mcp/dist
          mkdir -p apps/web/dist
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth BookshelfApi \
            --require-approval never -c env=dev -c version=${{ steps.last-good.outputs.tag }}
          pnpm --filter @bookshelf/web run build
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=dev -c version=${{ steps.last-good.outputs.tag }}

      - name: Fail job after rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Rolled back to ${{ steps.last-good.outputs.tag }}."
          exit 1

      - name: Tag deployed version
        if: steps.smoke.outcome != 'failure'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "Tagging commit as $TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin -f "$TAG"

  promote:
    name: Promote → prod
    needs: deploy
    uses: ./.github/workflows/promote.yml
    with:
      version: ${{ needs.deploy.outputs.version }}
    permissions:
      id-token: write
      contents: write
