name: Deploy to dev

# Continuous deployment to dev on every merge to main (ADR-020). Dev is the
# manual-test surface; it deploys under the short commit SHA and never creates a
# semver tag. Promotion to PROD is a separate, gated path: the Release Please PR
# (release-please.yml) cuts the tag + GitHub Release, and promote.yml ships it.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: read # dev no longer pushes tags (ADR-020) — read is enough
  id-token: write # OIDC for AWS

jobs:
  deploy:
    name: CDK Deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the rollback step can check out an older SHA

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve dev version
        id: version
        # Dev deploys under the short commit SHA, never a semver tag (ADR-020). The
        # SHA threads through the S3 build prefix, CloudFront originPath, the
        # /bookshelf/web/active-version SSM param, and the Version stack tag.
        run: |
          echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Dev version: dev-${GITHUB_SHA::7}"

      - name: Read last good dev SHA
        id: last-good
        # Rollback target is the last dev deploy whose smoke tests passed (ADR-020),
        # tracked in SSM instead of the tag ledger. Empty on the first ever run —
        # the rollback step is skipped in that case.
        run: |
          SHA=$(aws ssm get-parameter --name /bookshelf/web/last-good-dev \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Last good dev SHA: ${SHA:-<none>}"

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: Build MCP bundle
        run: pnpm --filter @bookshelf/mcp run build

      - name: Stub web dist for CDK synth
        # WebStack references apps/web/dist as an S3 asset at synth time.
        # The real build runs after stack outputs are resolved; this stub lets
        # CDK synthesise all stacks without the dist directory existing yet.
        run: mkdir -p apps/web/dist

      - name: Deploy Auth, API, and MCP stacks
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth BookshelfApi BookshelfMcp \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.version }}

      - name: Resolve stack outputs
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrlOutput'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolIdOutput'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientIdOutput'].OutputValue" \
            --output text)
          echo "api_url=$API_URL"           >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID"       >> "$GITHUB_OUTPUT"

      - name: Build web app
        # No VITE_* env needed: the bundle fetches /config.json at runtime, which
        # WebStack writes to S3 at deploy time from the Auth/API stack properties
        # (ADR-011). The same artifact works in any environment.
        run: pnpm --filter @bookshelf/web run build

      - name: Deploy Web stack
        # BucketDeployment inside WebStack syncs dist/ to S3 and invalidates
        # CloudFront — no separate sync or invalidation steps needed.
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.version }}

      - name: Post CloudFront URL to run summary
        run: |
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfWeb \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionUrlOutput'].OutputValue" \
            --output text)
          {
            echo "## 🚀 Deployed to dev"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **CloudFront URL** | [$CF_URL]($CF_URL) |"
            echo "| **Version** | \`${{ steps.version.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register CloudFront domain in Auth callbacks
        # Auth deployed before Web (no CloudFront URL yet). Now that WebStack is up,
        # pass the distribution domain as CDK context so Cognito's app client gets
        # the CloudFront callback URL registered. No-op on subsequent deploys if the
        # URL is already registered.
        run: |
          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfWeb \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionUrlOutput'].OutputValue" \
            --output text)
          CF_DOMAIN="${CF_URL#https://}"
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth \
            --require-approval never -c env=dev -c version=${{ steps.version.outputs.version }} \
            -c cloudfront-domain="${CF_DOMAIN}"

      - name: Smoke tests
        id: smoke
        continue-on-error: true
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke

      - name: Rollback to last good dev SHA
        if: steps.smoke.outcome == 'failure' && steps.last-good.outputs.sha != ''
        run: |
          echo "Smoke tests failed — rolling back to ${{ steps.last-good.outputs.sha }}"
          git checkout ${{ steps.last-good.outputs.sha }}
          pnpm install --frozen-lockfile
          pnpm --filter @bookshelf/api run build
          pnpm --filter @bookshelf/mcp run build 2>/dev/null || mkdir -p apps/mcp/dist
          mkdir -p apps/web/dist
          ROLLBACK_VERSION="dev-$(git rev-parse --short=7 HEAD)"
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfAuth BookshelfApi \
            --require-approval never -c env=dev -c version="$ROLLBACK_VERSION"
          pnpm --filter @bookshelf/web run build
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=dev -c version="$ROLLBACK_VERSION"

      - name: Fail job after rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Rolled back to ${{ steps.last-good.outputs.sha }}."
          exit 1

      - name: Record last good dev SHA
        if: steps.smoke.outcome != 'failure'
        # Smoke passed — this commit becomes the rollback target for the next deploy
        # (ADR-020). Replaces the per-merge version tag the old design pushed here.
        run: |
          aws ssm put-parameter --name /bookshelf/web/last-good-dev \
            --type String --overwrite --value "$GITHUB_SHA"
          echo "Recorded last good dev SHA: $GITHUB_SHA"

      - name: Sync Jira tickets → On dev
        if: steps.smoke.outcome != 'failure'
        # Dev deploy succeeded and smoke passed — move each ticket referenced in the
        # merge commit to "On dev", the human-QA queue (ADR-024). The key is read from
        # the squash-commit subject (same source as the prod → Done sync). Idempotent
        # and soft-failing (::warning:: + exit 0), so a Jira hiccup never red-builds a
        # good dev deploy. No-ops with a warning until the "On dev" status exists in
        # Jira (BOOKSHELF-80), so shipping this before the workflow config is safe.
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/jira-dev-sync.mjs
