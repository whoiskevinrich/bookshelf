name: Deploy to Sandbox

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: write # push git tag
  id-token: write # OIDC for AWS

jobs:
  deploy:
    name: CDK Deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true # required for "Capture last good version tag"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture last good version tag
        id: last-good
        run: |
          TAG=$(git tag --sort=-version:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Last good tag: $TAG"

      - name: Resolve version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: CDK deploy all stacks
        run: pnpm --filter @bookshelf/infra run cdk deploy --all --require-approval never -c version=${{ steps.version.outputs.tag }}

      - name: Resolve SSM outputs
        id: ssm
        run: |
          API_URL=$(aws ssm get-parameter --name "/bookshelf/api/url" --query "Parameter.Value" --output text)
          USER_POOL_ID=$(aws ssm get-parameter --name "/bookshelf/cognito/user-pool-id" --query "Parameter.Value" --output text)
          CLIENT_ID=$(aws ssm get-parameter --name "/bookshelf/cognito/client-id" --query "Parameter.Value" --output text)
          BUCKET=$(aws ssm get-parameter --name "/bookshelf/web/bucket-name" --query "Parameter.Value" --output text)
          DIST_ID=$(aws ssm get-parameter --name "/bookshelf/web/distribution-id" --query "Parameter.Value" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ steps.ssm.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.ssm.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.ssm.outputs.client_id }}
          VITE_COGNITO_REGION: ${{ vars.AWS_REGION }}
        run: pnpm --filter @bookshelf/web run build

      - name: Sync web assets to S3
        run: |
          aws s3 sync apps/web/dist \
            s3://${{ steps.ssm.outputs.bucket }}/builds/${{ steps.version.outputs.tag }}/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.ssm.outputs.distribution_id }} \
            --paths "/*"

      - name: Smoke tests
        id: smoke
        continue-on-error: true
        env:
          API_BASE_URL: ${{ steps.ssm.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke

      - name: Rollback API to last good version
        if: steps.smoke.outcome == 'failure' && steps.last-good.outputs.tag != ''
        run: |
          echo "Smoke tests failed — rolling back to ${{ steps.last-good.outputs.tag }}"
          git checkout ${{ steps.last-good.outputs.tag }}
          pnpm install --frozen-lockfile
          pnpm --filter @bookshelf/api run build
          pnpm --filter @bookshelf/infra run cdk deploy --all --require-approval never -c version=${{ steps.last-good.outputs.tag }}

      - name: Rollback web assets to last good version
        if: steps.smoke.outcome == 'failure' && steps.last-good.outputs.tag != ''
        env:
          VITE_API_BASE_URL: ${{ steps.ssm.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.ssm.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.ssm.outputs.client_id }}
          VITE_COGNITO_REGION: ${{ vars.AWS_REGION }}
        run: |
          pnpm --filter @bookshelf/web run build
          aws s3 sync apps/web/dist \
            s3://${{ steps.ssm.outputs.bucket }}/builds/${{ steps.last-good.outputs.tag }}/ \
            --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.ssm.outputs.distribution_id }} \
            --paths "/*"

      - name: Fail job after rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed. Rolled back to ${{ steps.last-good.outputs.tag }}."
          exit 1

      - name: Tag deployed version
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          echo "Tagging commit as $TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
