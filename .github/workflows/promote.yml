name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g. 1.2.3) — must exist as a git tag v{version}"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to promote (e.g. 1.2.3) — must exist as a git tag v{version}"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: write # create GitHub release
  id-token: write # OIDC for AWS

jobs:
  promote:
    name: CDK Deploy → prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Log promotion target
        run: |
          echo "Promoting version: v${{ inputs.version }}"

      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Confirm promotion target
        # The release identity is the git tag, not package.json (ADR-017). We are
        # checked out at `v${inputs.version}`, so the tree is exactly what was
        # deployed to dev. Verify the tag resolves; package.json carries no version.
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "  Promoting version : v${{ inputs.version }}"
          echo "  Target environment: prod"
          echo "  Commit            : $(git rev-parse HEAD)"
          echo "=================================================="
          if ! git describe --tags --exact-match >/dev/null 2>&1; then
            echo "::error::HEAD is not at tag v${{ inputs.version }} — refusing to promote an untagged commit"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: Build MCP bundle
        run: pnpm --filter @bookshelf/mcp run build

      - name: Stub web dist for CDK synth
        # WebStack references apps/web/dist as an S3 asset at synth time. The real
        # build runs after stack outputs are resolved; this stub lets CDK
        # synthesise all stacks before the dist directory exists.
        run: mkdir -p apps/web/dist

      - name: Bootstrap Route53 hosted zone and inject CDK context
        # HostedZone.fromLookup() in ApiStack and WebStack is a synth-time Route53
        # query. CDK caches the result in cdk.context.json; without a cached entry it
        # hits the live API, which fails if BookshelfDns hasn't been deployed yet.
        #
        # This step breaks the chicken-and-egg:
        #   1. If the zone already exists — inject its ID into context; done.
        #   2. If not — write a placeholder into context so CDK can synthesise all
        #      stacks, deploy BookshelfDns only (which creates the zone), then
        #      replace the placeholder with the real zone ID.
        #
        # Subsequent cdk deploy steps read the cached value and skip the live lookup.
        # Context key format confirmed from aws-cdk-lib@2.x source (context-provider.js):
        #   hosted-zone:account=<stack.account>:domainName=<domain>:region=<stack.region>
        #   Fields are sorted alphabetically; undefined props (privateZone, vpcId) omitted.
        #   ApiStack and WebStack are both in us-west-2, so region=us-west-2.
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DOMAIN="${{ vars.PROD_DOMAIN }}"
          CTX_FILE="packages/infra/cdk.context.json"
          CTX_KEY="hosted-zone:account=${ACCOUNT_ID}:domainName=${DOMAIN}:region=us-west-2"

          # Check whether the hosted zone already exists in Route53.
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${DOMAIN}." \
            --query "HostedZones[?Name=='${DOMAIN}.'].Id" \
            --output text | sed 's|.*/hostedzone/||')

          if [ -z "$ZONE_ID" ]; then
            echo "Hosted zone not found — running BookshelfDns bootstrap..."

            # Inject a placeholder so CDK synth succeeds for all stacks.
            # Only BookshelfDns is deployed here; the placeholder is never used
            # in a real CloudFormation resource in this step.
            jq --arg key "$CTX_KEY" --arg domain "$DOMAIN" \
              '. + {($key): {"Id": "PLACEHOLDER", "Name": $domain}}' \
              "$CTX_FILE" > /tmp/cdk.context.json \
              && mv /tmp/cdk.context.json "$CTX_FILE"

            pnpm --filter @bookshelf/infra run cdk deploy BookshelfDns \
              --require-approval never -c env=prod -c version=v${{ inputs.version }}

            # Fetch the real zone ID and NS values from the CloudFormation output.
            ZONE_ID=$(aws cloudformation describe-stacks \
              --stack-name BookshelfDns \
              --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" \
              --output text)
            NS_VALUES=$(aws cloudformation describe-stacks \
              --stack-name BookshelfDns \
              --query "Stacks[0].Outputs[?OutputKey=='NameServers'].OutputValue" \
              --output text)
            echo "::notice::BookshelfDns bootstrap complete."
            echo "::notice::Add an NS record for '${DOMAIN}' at Cloudflare pointing to:"
            echo "::notice::${NS_VALUES}"
            echo "::notice::Then wait for DNS propagation (~15 min) before re-running this workflow."
            echo "::warning::ACM cert validation (next step) will stall until the NS delegation is live."
          fi

          echo "Hosted zone: ${ZONE_ID}"

          # Write (or overwrite) the real zone ID so all subsequent cdk deploy
          # steps use the cached value rather than a live Route53 lookup.
          jq --arg key "$CTX_KEY" \
            --arg id "/hostedzone/${ZONE_ID}" \
            --arg domain "$DOMAIN" \
            '. + {($key): {"Id": $id, "Name": $domain}}' \
            "$CTX_FILE" > /tmp/cdk.context.json \
            && mv /tmp/cdk.context.json "$CTX_FILE"

      - name: Reconcile orphaned Cognito identity providers
        # If a Google IdP was manually created (or left behind by a rolled-back
        # deploy) it won't be tracked in the BookshelfAuth CloudFormation stack.
        # CloudFormation's early-validation rejects the change set when CDK tries
        # to CREATE a resource that already exists in the service. This step detects
        # that case and deletes the orphan so CDK can create and track it cleanly.
        run: |
          set -euo pipefail
          STACK_NAME="BookshelfAuth"

          # Distinguish "stack does not exist" (safe to skip) from any other
          # failure (bad credentials, throttling, access denied — fail loudly).
          CF_OUTPUT=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolIdOutput'].OutputValue" \
            --output text 2>&1) || {
            if echo "$CF_OUTPUT" | grep -q "does not exist"; then
              echo "BookshelfAuth stack not found — nothing to reconcile."
              exit 0
            fi
            echo "::error::Failed to describe stack $STACK_NAME: $CF_OUTPUT"
            exit 1
          }

          # Guard against a renamed/missing output returning the literal "None".
          POOL_ID="$CF_OUTPUT"
          if [ -z "$POOL_ID" ] || [ "$POOL_ID" = "None" ]; then
            echo "BookshelfAuth stack found but UserPoolIdOutput is missing — nothing to reconcile."
            exit 0
          fi

          echo "User pool: $POOL_ID"

          # Check if Google IdP is already tracked in the stack.
          TRACKED=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Cognito::UserPoolIdentityProvider'].PhysicalResourceId" \
            --output text)

          if [ -n "$TRACKED" ]; then
            echo "Google IdP already tracked in CloudFormation ($TRACKED) — nothing to do."
            exit 0
          fi

          # IdP is not in the stack. Check if it exists in Cognito, distinguishing
          # "does not exist" (safe no-op) from any other failure (fail loudly).
          IDP_OUTPUT=$(aws cognito-idp describe-identity-provider \
            --user-pool-id "$POOL_ID" \
            --provider-name Google \
            --query "IdentityProvider.ProviderName" \
            --output text 2>&1) || {
            if echo "$IDP_OUTPUT" | grep -q "ResourceNotFoundException"; then
              echo "No orphaned Google IdP — nothing to do."
              exit 0
            fi
            echo "::error::Failed to describe Cognito IdP in pool $POOL_ID: $IDP_OUTPUT"
            exit 1
          }

          if [ -n "$IDP_OUTPUT" ] && [ "$IDP_OUTPUT" != "None" ]; then
            echo "Orphaned Google IdP found in pool $POOL_ID — removing so CDK can create and track it."
            aws cognito-idp delete-identity-provider \
              --user-pool-id "$POOL_ID" \
              --provider-name Google
            echo "Orphaned Google IdP removed."
          else
            echo "No orphaned Google IdP — nothing to do."
          fi

      - name: Deploy cert, Auth, API, and MCP stacks
        # `-c env=prod` applies the full prod topology atomically (ADR-009).
        # BookshelfDns is included as a dependency and is either already deployed
        # (bootstrap ran above) or a no-op on subsequent runs.
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy \
            BookshelfCdnCert BookshelfAuth BookshelfApi BookshelfMcp \
            --require-approval never -c env=prod -c version=v${{ inputs.version }}

      - name: Resolve stack outputs (prod)
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrlOutput'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolIdOutput'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientIdOutput'].OutputValue" \
            --output text)
          echo "api_url=$API_URL"           >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID"       >> "$GITHUB_OUTPUT"

      - name: Build web app
        # No VITE_* env needed: the bundle fetches /config.json at runtime, which
        # WebStack writes to S3 at deploy time from the Auth/API stack properties
        # (ADR-011). apiBaseUrl resolves to "/api" (same-origin) for prod.
        run: pnpm --filter @bookshelf/web run build

      - name: Deploy Web stack
        # BucketDeployment inside WebStack syncs dist/ to S3 and invalidates
        # CloudFront — no separate sync or invalidation steps needed.
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=prod -c version=v${{ inputs.version }}

      - name: Smoke tests (prod)
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke

      - name: Create GitHub Release
        # Idempotent (ADR-017): a re-run, or promoting an already-released version,
        # is a no-op instead of an HTTP 422. The release — not package.json — is the
        # immutable record that this version shipped.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping creation (idempotent)."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
