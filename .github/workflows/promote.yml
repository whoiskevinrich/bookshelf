name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g. 1.2.3) — must exist as a git tag v{version}"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: read
  id-token: write # OIDC for AWS

jobs:
  promote:
    name: CDK Deploy → prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Log promotion target
        run: echo "Promoting version: v${{ inputs.version }}"

      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Confirm promotion target
        run: |
          ACTUAL=$(jq -r .version package.json)
          echo "=================================================="
          echo "  Promoting version : $ACTUAL"
          echo "  Target environment: prod"
          echo "=================================================="
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "::error::package.json version ($ACTUAL) does not match input (${{ inputs.version }})"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: CDK deploy all stacks to prod
        run: pnpm deploy:infra
        env:
          BOOKSHELF_ENV: prod

      - name: Resolve SSM outputs (prod)
        id: ssm
        run: |
          PARAMS=$(aws ssm get-parameters \
            --names \
              "/bookshelf/api/url" \
              "/bookshelf/cognito/user-pool-id" \
              "/bookshelf/cognito/client-id" \
              "/bookshelf/web/bucket-name" \
              "/bookshelf/web/distribution-id" \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json)
          echo "api_url=$(echo "$PARAMS"       | jq -r '.[] | select(.Name=="/bookshelf/api/url") | .Value')"              >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(echo "$PARAMS"  | jq -r '.[] | select(.Name=="/bookshelf/cognito/user-pool-id") | .Value')" >> "$GITHUB_OUTPUT"
          echo "client_id=$(echo "$PARAMS"     | jq -r '.[] | select(.Name=="/bookshelf/cognito/client-id") | .Value')"    >> "$GITHUB_OUTPUT"
          echo "bucket=$(echo "$PARAMS"        | jq -r '.[] | select(.Name=="/bookshelf/web/bucket-name") | .Value')"      >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$PARAMS" | jq -r '.[] | select(.Name=="/bookshelf/web/distribution-id") | .Value')" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ steps.ssm.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.ssm.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.ssm.outputs.client_id }}
          VITE_COGNITO_REGION: ${{ vars.AWS_REGION }}
        run: pnpm --filter @bookshelf/web run build

      - name: Sync web assets to S3
        run: |
          aws s3 sync apps/web/dist \
            s3://${{ steps.ssm.outputs.bucket }}/builds/v${{ inputs.version }}/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.ssm.outputs.distribution_id }} \
            --paths "/*"

      - name: Smoke tests (prod)
        env:
          API_BASE_URL: ${{ steps.ssm.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke
