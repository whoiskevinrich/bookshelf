name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g. 1.2.3) — must exist as a git tag v{version}"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel an in-flight deploy

permissions:
  contents: read
  id-token: write # OIDC for AWS

jobs:
  promote:
    name: CDK Deploy → prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Log promotion target
        run: |
          echo "Promoting version: v${{ inputs.version }}"

      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Confirm promotion target
        run: |
          ACTUAL=$(jq -r .version package.json)
          echo "=================================================="
          echo "  Promoting version : $ACTUAL"
          echo "  Target environment: prod"
          echo "=================================================="
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "::error::package.json version ($ACTUAL) does not match input (${{ inputs.version }})"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: Stub web dist for CDK synth
        # WebStack references apps/web/dist as an S3 asset at synth time. The real
        # build runs after stack outputs are resolved; this stub lets CDK
        # synthesise all stacks before the dist directory exists.
        run: mkdir -p apps/web/dist

      - name: Deploy cert, Auth, and API stacks
        # NOTE: the FIRST prod deploy requires the manual bootstrap in
        # docs/runbooks/prod-domain-setup.md (issue the ACM certs by adding a
        # validation CNAME at Hover, then add the host CNAMEs) — otherwise ACM DNS
        # validation blocks the deploy. This workflow is steady-state promotion;
        # once the certs are issued and the CNAMEs exist these are fast no-ops.
        # `-c env=prod` applies the full prod topology atomically (ADR-009).
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy \
            BookshelfCdnCert BookshelfAuth BookshelfApi \
            --require-approval never -c env=prod -c version=v${{ inputs.version }}

      - name: Resolve stack outputs (prod)
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name BookshelfApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrlOutput'].OutputValue" \
            --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolIdOutput'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name BookshelfAuth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientIdOutput'].OutputValue" \
            --output text)
          echo "api_url=$API_URL"           >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID"       >> "$GITHUB_OUTPUT"

      - name: Build web app
        # No VITE_* env needed: the bundle fetches /config.json at runtime, which
        # WebStack writes to S3 at deploy time from the Auth/API stack properties
        # (ADR-011). apiBaseUrl resolves to "/api" (same-origin) for prod.
        run: pnpm --filter @bookshelf/web run build

      - name: Deploy Web stack
        # BucketDeployment inside WebStack syncs dist/ to S3 and invalidates
        # CloudFront — no separate sync or invalidation steps needed.
        run: |
          pnpm --filter @bookshelf/infra run cdk deploy BookshelfWeb \
            --require-approval never -c env=prod -c version=v${{ inputs.version }}

      - name: Smoke tests (prod)
        env:
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: pnpm --filter @bookshelf/api run test:smoke
