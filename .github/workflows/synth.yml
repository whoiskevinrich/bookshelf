name: CDK Synth

on:
  pull_request:
    branches: [main]

concurrency:
  group: synth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK synth
        run: pnpm synth
