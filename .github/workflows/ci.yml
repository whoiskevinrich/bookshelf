name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API bundle
        run: pnpm --filter @bookshelf/api run build

      - name: Run tests
        run: pnpm test

  synth:
    name: CDK Synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK synth
        run: pnpm synth

  version-gate:
    name: Unique Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          ref: ${{ github.head_ref }}

      - name: Ensure version is unique (auto-bump if already tagged)
        run: |
          VERSION=$(jq -r .version package.json)
          echo "Current version: v$VERSION"

          if ! git tag --list "v$VERSION" | grep -q "v$VERSION"; then
            echo "Version v$VERSION is unique — no bump needed."
            exit 0
          fi

          echo "Tag v$VERSION already exists — auto-bumping..."
          while git tag --list "v$VERSION" | grep -q "v$VERSION"; do
            npm version patch --no-git-tag-version
            VERSION=$(jq -r .version package.json)
          done
          echo "Bumped to v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v$VERSION"
          git push origin HEAD:${{ github.head_ref }}
          echo "::notice::Version auto-bumped to v$VERSION. Re-run CI on this PR to update check status."
