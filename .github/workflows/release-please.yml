name: Release Please

# Maintains a standing "release PR" on main (ADR-020). Each merge to main keeps
# the PR up to date — accumulating Conventional Commits, bumping semver, and
# regenerating CHANGELOG.md. Merging that PR is the prod gate: release-please cuts
# the tag `vX.Y.Z` + GitHub Release, and the `promote` job below ships it to prod.
#
# We chain promote via workflow_call on the `release_created` output rather than an
# `on: release` trigger in promote.yml, because a release created by the default
# GITHUB_TOKEN does not trigger other workflows.
#
# release-type: simple keeps the version in .release-please-manifest.json only —
# package.json stays pinned at 0.0.0 (ADR-007). Dev is untouched; it deploys
# continuously off the commit SHA (deploy.yml).

on:
  push:
    branches: [main]

permissions:
  contents: write # create the release PR branch, tags, and GitHub Release
  pull-requests: write # open and maintain the release PR

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    name: Promote → prod
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/promote.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      id-token: write
      contents: read
