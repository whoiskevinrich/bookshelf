packages:
  - "apps/*"
  - "packages/*"

overrides:
  esbuild: ">=0.28.1"
  # Force the transitive copy of hono (pulled in via @modelcontextprotocol/sdk →
  # @hono/node-server@1.19.14) up to a patched release. Fixes Dependabot alerts
  # #7–#11 (CORS wildcard-with-credentials, body-limit bypass, serve-static path
  # traversal, Set-Cookie/header dropping). Direct deps already request ^4.12.27.
  hono@<4.12.25: ">=4.12.25"

confirmModulesPurge: false

# pnpm 11 supply-chain policy: disabled here because all deps are published by
# well-known trusted maintainers (AWS SDK, Hono, React) and this is a solo project.
# Re-enable (e.g. minimumReleaseAge: "72 hours") if contributors are added.
minimumReleaseAge: false

# pnpm 11 replaces onlyBuiltDependencies with allowBuilds (explicit per-package consent).
allowBuilds:
  esbuild: true
  msw: true
  tesseract.js: true
