services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 15

volumes:
  dynamodb-data:
